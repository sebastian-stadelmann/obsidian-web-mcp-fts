name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0  # no floating major tag exists for this action
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --frozen: the lockfile is the contract, including the pinned server commit.
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check src tests
      # Includes tests/test_live_server.py: the real server process, called over HTTP.
      - run: uv run --frozen --extra dev pytest -v
