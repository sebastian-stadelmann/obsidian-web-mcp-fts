[project]
name = "obsidian-web-mcp-fts"
version = "0.1.0"
description = "SQLite FTS5 full-text search extension for obsidian-web-mcp (BM25-ranked, stemmed, multilingual, no extra services)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Stadelmann" }]
requires-python = ">=3.12"
keywords = ["obsidian", "mcp", "model-context-protocol", "full-text-search", "sqlite", "fts5", "bm25", "stemming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "obsidian-web-mcp @ git+https://github.com/jimprosser/obsidian-web-mcp@a29af7092e95",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    # Pinned to a minor: ruff's default rule set grows between minors, and CI must not
    # start failing on code nobody touched.
    "ruff>=0.16,<0.17",
]

[project.urls]
Repository = "https://github.com/sebastian-stadelmann/obsidian-web-mcp-fts"
Issues = "https://github.com/sebastian-stadelmann/obsidian-web-mcp-fts/issues"
Upstream = "https://github.com/jimprosser/obsidian-web-mcp"

[project.scripts]
vault-mcp-fts = "vault_fts.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_fts"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["vault_fts"]
branch = true
# tests/test_live_server.py runs the server in a child process that is stopped with
# SIGTERM. Without these two, everything that only runs there (main.py) counts as 0 %.
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor, not a target: measured coverage is 95 %. pytest --cov fails below this.
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# The word lists are easier to read and to extend as blocks of text.
"src/vault_fts/stopwords.py" = ["SIM905"]
